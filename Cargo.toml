[workspace]
resolver = "2"
members = [
    "crates/overseer-proto",
    "crates/overseer-daemon",
    "crates/overseer-term",
    "crates/overseer-gui",
    "crates/overseer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
alacritty_terminal = "0.26"
portable-pty = "0.9"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
bytes = "1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
