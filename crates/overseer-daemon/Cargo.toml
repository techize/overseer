[package]
name = "overseer-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
overseer-proto = { path = "../overseer-proto" }
overseer-term = { path = "../overseer-term" }
portable-pty.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time", "macros", "net", "io-util", "process"] }
regex.workspace = true
bytes.workspace = true
anyhow.workspace = true
tracing.workspace = true
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
